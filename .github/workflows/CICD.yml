name: Deploy dev to GitHub Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  VITE_FACTORY_CONTRACT: ${{secrets.VITE_FACTORY_CONTRACT}}
  VITE_FACTORY_RPC: ${{secrets.VITE_FACTORY_RPC}}
  VITE_WC_PROJECT_ID: ${{secrets.VITE_WC_PROJECT_ID}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate factory RPC
        run: bun scripts/validate-rpc.ts

      - name: Build project
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry_2.outputs.page_url || steps.deploy_retry_1.outputs.page_url || steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # GitHub's artifact listing can lag upload finalization
      # (actions/deploy-pages#451). Retry only deploy: rerunning the build job
      # would upload a duplicate github-pages artifact and fail permanently.
      - name: Wait for artifact visibility
        run: sleep 10

      # deploy-pages@v5.0.1 still bundles @actions/artifact@2.x, which imports
      # Node's deprecated punycode module. Track the upstream fix:
      # https://github.com/actions/deploy-pages/issues/413
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before first deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages deployment
        id: deploy_retry_1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before second deploy retry
        if: steps.deploy_retry_1.outcome == 'failure'
        run: sleep 40

      - name: Retry GitHub Pages deployment again
        id: deploy_retry_2
        if: steps.deploy_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5

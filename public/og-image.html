<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OG Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0c29;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(37, 99, 235, 0.10) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, rgba(194, 132, 252, 0.06) 0%, transparent 50%),
      linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #16213e 100%);
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .dots {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(6, 182, 212, 0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: 20px 20px;
  }

  .ornament-top-right {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 500px;
    height: 500px;
    border: 1px solid rgba(6, 182, 212, 0.08);
    border-radius: 50%;
  }

  .ornament-bottom-left {
    position: absolute;
    bottom: -160px;
    left: -100px;
    width: 400px;
    height: 400px;
    border: 1px solid rgba(37, 99, 235, 0.08);
    border-radius: 50%;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 50px 80px;
  }

  .icon-wrapper {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(37, 99, 235, 0.15));
    border: 1px solid rgba(6, 182, 212, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    box-shadow: 0 4px 32px rgba(6, 182, 212, 0.08);
  }

  .icon-wrapper img {
    width: 44px;
    height: 44px;
    opacity: 0.95;
  }

  .title {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -1.5px;
    line-height: 1;
    background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 30%, #2563eb 70%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.15));
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.2px;
    margin-bottom: 36px;
  }

  .features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 60px;
    margin-bottom: 42px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.78);
  }

  .check {
    color: #22d3ee;
    font-size: 20px;
    flex-shrink: 0;
  }

  .url {
    font-size: 20px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.28);
    letter-spacing: 0.5px;
  }

  .footer-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #06b6d4, #2563eb, #7c3aed);
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="dots"></div>
    <div class="ornament-top-right"></div>
    <div class="ornament-bottom-left"></div>

    <div class="content">
      <div class="icon-wrapper">
        <img src="IB_icon.png" alt="Anthology logo" />
      </div>
      <div class="title">Anthology</div>
      <div class="subtitle">Local-first knowledge management</div>

      <div class="features">
        <div class="feature"><span class="check">&#x2713;</span> Offline-first</div>
        <div class="feature"><span class="check">&#x2713;</span> PWA</div>
        <div class="feature"><span class="check">&#x2713;</span> Blockchain publishing</div>
        <div class="feature"><span class="check">&#x2713;</span> QR sharing</div>
      </div>

      <div class="url">memory.inbytes.xyz</div>
    </div>

    <div class="footer-line"></div>
  </div>
</body>
</html>
